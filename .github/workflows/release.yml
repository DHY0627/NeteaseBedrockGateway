name: Release

# 打 tag（如 v1.0.0）时自动交叉编译并发布 Release；也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag 名（手动触发时必填，例如 v1.0.0）'
        required: true
        type: string

# 默认权限只读，发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：x86(386) / x64(amd64) / ARM64
          - { goos: windows, goarch: '386' }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          # Linux：x86(386) / x64(amd64) / ARM(arm) / ARM64
          - { goos: linux,   goarch: '386' }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm, goarm: '7' }
          - { goos: linux,   goarch: arm64 }
          # macOS：Intel(x64) / Apple 芯片(ARM64)
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }

    steps:
      # 依赖以 git submodule 形式放在 third_party/，必须 recursive 拉取，否则编译不过
      - name: 检出代码（含 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 防守：submodule 少拉一个就会在 go build 时报难懂的错，先明确报出来
      - name: 校验 submodule 是否就位
        run: |
          missing="$(git submodule status | awk '/^-/ {print $2}')"
          if [ -n "$missing" ]; then
            echo "::error::以下 submodule 未拉取：$missing"
            git submodule status
            exit 1
          fi
          git submodule status

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          # 32 位 ARM 带 GOARM 后缀，便于区分 softfloat/hardfloat
          suffix="${GOARCH}"
          [ -n "${GOARM:-}" ] && suffix="${GOARCH}v${GOARM}"
          out="NeteaseBedrockGateway-${GOOS}-${suffix}${ext}"
          go build -trimpath -ldflags "-s -w" -o "dist/$out" ./cmd/gateway
          ls -lh "dist/"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseBedrockGateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 诊断工具只编当前 runner 平台（linux/amd64），够用且省时间
      - name: 编译诊断工具
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/diag
          for tool in relaydecode javaprobe logindump chaininfo pcapsum fecheck; do
            go build -trimpath -ldflags "-s -w" -o "dist/diag/$tool" "./cmd/diag/$tool"
          done
          tar -C dist -czf dist/NeteaseBedrockGateway-diag-linux-amd64.tar.gz diag
          rm -rf dist/diag

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          body: |
            ## 下载

            按你的系统选择对应文件，解压/直接运行即可，**无需安装 Go 环境**：

            | 系统 | 架构 | 文件 |
            |---|---|---|
            | Windows | x64（64 位） | `NeteaseBedrockGateway-windows-amd64.exe` |
            | Windows | x86（32 位） | `NeteaseBedrockGateway-windows-386.exe` |
            | Windows | ARM64 | `NeteaseBedrockGateway-windows-arm64.exe` |
            | Linux | x64（64 位） | `NeteaseBedrockGateway-linux-amd64` |
            | Linux | x86（32 位） | `NeteaseBedrockGateway-linux-386` |
            | Linux | ARM64（如树莓派 4/5、服务器） | `NeteaseBedrockGateway-linux-arm64` |
            | Linux | ARM 32 位（如树莓派 2/3、电视盒子） | `NeteaseBedrockGateway-linux-armv7` |
            | macOS | Intel | `NeteaseBedrockGateway-darwin-amd64` |
            | macOS | Apple 芯片 | `NeteaseBedrockGateway-darwin-arm64` |
            | 诊断工具 | Linux x64 | `NeteaseBedrockGateway-diag-linux-amd64.tar.gz` |

            > 分不清架构时：Windows 用「设置 → 系统 → 关于」看系统类型；Linux 执行 `uname -m`
            > （`x86_64` → amd64，`aarch64` → arm64，`armv7l` → armv7）。

            ## 运行

            **单文件自包含**：Web 控制台的前端已经打包进二进制，下载后直接运行即可，
            不需要额外前端文件，也不需要 Go 环境。

            ```bash
            # Linux / macOS —— 不带参数启动就进 Web 控制台
            chmod +x NeteaseBedrockGateway-linux-amd64
            ./NeteaseBedrockGateway-linux-amd64                  # 打开 http://127.0.0.1:8765/  默认 user / password
            ./NeteaseBedrockGateway-linux-amd64 -port 8765       # 指定控制台端口（1-65535）
            sudo ./NeteaseBedrockGateway-linux-amd64 -install    # 注册为 systemd 服务（开机自启）
            sudo ./NeteaseBedrockGateway-linux-amd64 -uninstall  # 卸载上面注册的服务
            ```

            ```powershell
            # Windows
            .\NeteaseBedrockGateway-windows-amd64.exe               # 打开 http://127.0.0.1:8765/
            ```

            > 首次登录后请在「全局设置」里改掉默认密码。4399 账号在控制台「账号管理」里维护，
            > 密码以 AES-256-GCM 加密存储、登录后才解密，因此**开房必须先登录控制台**。
            > 控制台支持多实例（每个实例一个房间）、事件触发的自定义命令、实时日志。

            仍然支持像以前那样直接用命令行开一个房间（单房间 CLI 模式）：

            ```bash
            ./NeteaseBedrockGateway-linux-amd64 -u "4399账号" -p "密码" -target example.com:19132
            ```

            > `-target` 必须指向 **Geyser 的 RakNet（UDP）端口**（Geyser 默认 `19132`）。目标服还需要安装配套扩展
            > [GeyserNetease](https://github.com/DHY0627/GeyserNetease)，并设置
            > `-DGeyserNetease.ServerAddress=你的域名:19132`。详见
            > [README](https://github.com/DHY0627/NeteaseBedrockGateway#readme)。

            ## 校验

            下载后可用 `SHA256SUMS.txt` 校验完整性：

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
