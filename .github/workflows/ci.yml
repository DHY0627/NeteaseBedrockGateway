name: CI

# 每次 push / PR 都跑一遍：确保 submodule + 编译 + vet 是通的，
# 免得依赖坏掉要到打 tag 发布时才发现。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译与检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验 submodule 是否就位
        run: |
          missing="$(git submodule status | awk '/^-/ {print $2}')"
          if [ -n "$missing" ]; then
            echo "::error::以下 submodule 未拉取：$missing"
            exit 1
          fi
          git submodule status

      - name: go vet
        run: go vet ./...

      - name: 编译全部包
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: 冒烟检查（参数齐全 + 内嵌前端就位）
        env:
          CGO_ENABLED: '0'
        run: |
          go build -o /tmp/nbg ./cmd/gateway
          /tmp/nbg -h 2>&1 | tee /tmp/help.txt
          # 注意：Go 的 flag 用法里长参数打印成单横线（-debug，而不是 --debug）
          for flag in -- '-port' '-p' '-install' '-uninstall' '-web-root' '-run' '-d' '-debug'; do
            grep -q -- "$flag" /tmp/help.txt || { echo "::error::缺少参数 $flag"; exit 1; }
          done
          for f in login.html index.html assets/app.js assets/style.css; do
            [ -f "cmd/gateway/webui/$f" ] || { echo "::error::内嵌前端缺文件: $f"; exit 1; }
          done
          echo "参数与内嵌前端检查通过"

      - name: 构建全部发布目标（不发布，只验证能过）
        env:
          CGO_ENABLED: '0'
        run: |
          for target in windows/386 windows/amd64 windows/arm64 \
                        linux/386 linux/amd64 linux/arm linux/arm64 \
                        darwin/amd64 darwin/arm64; do
            goos="${target%%/*}"; goarch="${target##*/}"
            ext=""; [ "$goos" = "windows" ] && ext=".exe"
            echo "==> ${target}"
            GOOS="$goos" GOARCH="$goarch" GOARM=7 \
              go build -trimpath -ldflags "-s -w" -o "/tmp/NeteaseBedrockGateway-${goos}-${goarch}${ext}" ./cmd/gateway
          done
